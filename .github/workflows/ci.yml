name: CI

# OTOMATİK TETİKLEME KAPALI — sebebi kod değil, hesap faturası.
#
# GitHub Actions bu hesapta "billing issue" nedeniyle kilitli. İşler hiç
# başlamıyor, 2-3 saniyede düşüyor ve log bile üretmiyor; her push başına
# "All jobs have failed" e-postası geliyordu. Yani bildirimler gerçek bir
# sorunu göstermiyor, sadece gürültü üretiyordu.
#
# Silmek yerine tetikleyici manuele alındı: yapılandırma duruyor, fatura
# sorunu çözülünce aşağıdaki `push`/`pull_request` satırlarının yorumu
# kaldırılarak eski hâline dönülür.
#
# Bu arada aynı kontroller yerelde çalışıyor: `npm run check` (tip),
# `npm audit` (bağımlılık), ayrıca her dağıtım öncesi canlı uçtan uca testler.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

# Varsayılan izinleri en aza indir (tedarik zinciri saldırılarına karşı)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tip kontrolü + derleme
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: TypeScript tip kontrolü
        run: npm run check

      - name: Derleme
        run: npm run build
        env:
          # Derleme sırasında istemci env'i gerekmez; boş değerlerle derlenebilmeli
          NODE_ENV: production

  audit:
    name: Bağımlılık güvenlik denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Yüksek/kritik açıklarda başarısız ol; düşük seviyeler uyarı olarak kalır
      - name: npm audit (high+)
        run: npm audit --audit-level=high
