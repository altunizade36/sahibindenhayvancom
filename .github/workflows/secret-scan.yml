name: Gizli Bilgi Taraması

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Her pazartesi 06:00 UTC — geçmişe sonradan sızmış bir şey varsa yakalar
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Sızmış anahtar taraması
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Tüm geçmişi tara — sadece son commit'i değil
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  env-guard:
    name: .env commit edilmiş mi?
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Takip edilen gizli dosyaları kontrol et
        run: |
          set -euo pipefail
          # .env.example dışındaki .env* ve anahtar dosyaları depoda olmamalı
          leaked=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|\.pem$|\.p12$|\.pfx$|\.p8$|serviceAccount.*\.json$|firebase-adminsdk.*\.json$' \
            | grep -v '^\.env\.example$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Depoda gizli dosya var:"
            echo "$leaked"
            exit 1
          fi
          echo "✅ Gizli dosya bulunamadı."
