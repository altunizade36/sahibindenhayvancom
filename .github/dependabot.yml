version: 2
updates:
  # npm bağımlılıkları
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels: ["bağımlılık"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # Gürültüyü azalt: küçük/yama güncellemeleri tek PR'da toplansın
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions sürümleri (tedarik zinciri güvenliği için önemli)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["ci"]
    commit-message:
      prefix: "ci"
